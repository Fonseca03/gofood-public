<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoFood</title>
  <style>
        :root {
      --fondo: #FAF6EF;
      --texto: #2A2420;
      --acento: #FF8000;
      --acento-claro: #FFA01A;
      --acento-oscuro: #E66800;
      --acento-texto: #FFFFFF;
      --abierto: #96E600;
      --cerrado: #A13D3D;
      --borde: #E4DACB;
    }
    [data-tema="oscuro"] {
      --fondo: #121212;
      --texto: #EFEFEF;
      --acento: #FFA01A;
      --acento-claro: #FFB84D;
      --acento-oscuro: #FF8000;
      --acento-texto: #121212;
      --abierto: #96E600;
      --cerrado: #C97070;
      --borde: #2E2E2E;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: var(--fondo);
      color: var(--texto);
      transition: background 0.2s, color 0.2s;
    }
    


    input {
      display: block;
      margin-bottom: 10px;
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      font-size: 16px;
      background: var(--fondo);
      color: var(--texto);
      border: 1px solid var(--borde);
      border-radius: 4px;
    }
    #buscar {
      max-width: 550px;
      margin: 0 auto 15px auto;
      padding: 14px 24px;
      border-radius: 30px;
      border: 1px solid var(--borde);
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.1);
      font-size: 17px;
      text-align: left;
    }
    #buscar:focus {
      outline: none;
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.2);
    }


            button {
      padding: 12px 26px;
      cursor: pointer;
      background: linear-gradient(180deg, var(--acento-claro), var(--acento-oscuro));
      color: var(--acento-texto);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.25);
      transform: scale(1);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover { opacity: 0.95; }
    button:active {
      transform: scale(0.97);
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.35);
    }
    .estado-abierto { color: var(--abierto); font-weight: bold; }
    .estado-cerrado { color: var(--cerrado); font-weight: bold; }


    .resultado {
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .logo-mini {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      object-fit: cover;
      vertical-align: middle;
      margin-right: 8px;
    }



        .resultado h3 { margin: 0 0 5px 0; color: var(--acento); }
        .resultado h3 a { color: var(--acento); text-decoration: none; }
        .resultado h3 a:hover { color: var(--acento); }
    .login-link { margin-top: 40px; text-align: center; }
    .login-link a { color: var(--texto); font-size: 14px; cursor: pointer; }
    
    #error-login { color: var(--cerrado); }
    .fila-password { display: flex; align-items: center; }
    .fila-password input { flex: 1; margin-bottom: 0; }
    .fila-password button { margin-left: 8px; width: 50px; }
        .header-superior {
      position: relative;
      margin-bottom: 20px;
    }
    
    #boton-tema {
      background: transparent;
      color: var(--texto);
      border: 1px solid var(--borde);
    }


    .modal-fondo {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }
    .modal-fondo.activo { display: flex; }
    .modal-caja {
      background: var(--fondo);
      color: var(--texto);
      padding: 24px;
      border-radius: 8px;
      max-width: 350px;
      width: 90%;
      position: relative;
    }
    .modal-cerrar {
      position: absolute;
      top: 8px;
      right: 12px;
      background: transparent;
      border: none;
      box-shadow: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--texto);
      padding: 0;
    }
  </style>
</head>
<body>

            <div class="header-superior">
    <button type="button" id="boton-mostrar-login" onclick="mostrarLogin()" style="background: transparent; color: var(--texto); border: 1px solid var(--borde); position: absolute; top: 0; left: 0; font-size: 13px; padding: 8px 12px;">🍽️ Restaurantes</button>
    <div style="position: absolute; top: 0; right: 0; display: flex; gap: 8px;">
      <button id="boton-idioma" onclick="cambiarIdioma()">🌐 English</button>
      <button id="boton-tema" onclick="cambiarTema()">🌙 Modo oscuro</button>
    </div>
    <img src="logo.png" alt="GoFood" style="display: block; margin: 0 auto; max-height: 250px;">
  </div>



  <input type="text" id="buscar" placeholder="Buscá por nombre o tipo de comida..." onkeypress="if(event.key === 'Enter') buscar()">
    <div style="text-align: center;">
    <button id="boton-buscar" onclick="buscar()">Buscar</button>
  </div>



<div id="filtros" style="display: none;">
  

  <label style="display: inline-block; margin-top: 10px; font-weight: normal;">
    <input type="checkbox" id="solo-abiertos" checked onchange="buscar()" style="display: inline-block; width: auto; margin-right: 6px;">
    <span id="texto-solo-abiertos">Solo abiertos</span>
  </label>

  <select id="orden-precio" onchange="buscar()" style="width: auto; display: inline-block; margin-left: 10px; padding: 8px;">
    <option value="" id="opcion-precio-default">Ordenar platos por precio</option>
    <option value="asc" id="opcion-precio-asc">Precio: menor a mayor</option>
    <option value="desc" id="opcion-precio-desc">Precio: mayor a menor</option>
  </select>

<button type="button" id="boton-cercania" onclick="activarCercania()" style="margin-left: 10px;">📍 Ordenar por cercanía</button>
</div>



  <div id="resultados"></div>
    <div id="seccion-abiertos">
    <h2 id="titulo-abiertos">Restaurantes abiertos ahora</h2>
    <div id="lista-abiertos">Cargando...</div>
  </div>

    <div id="login-restaurante" class="modal-fondo">
    <div class="modal-caja">
      <button type="button" class="modal-cerrar" onclick="mostrarLogin()">✕</button>
      
      <h3 id="titulo-login">Iniciar sesión - Restaurantes</h3>
      <input type="email" id="login-email" placeholder="Email" onkeypress="if(event.key === 'Enter') loginRestaurante()">
      <div class="fila-password">
        <input type="password" id="login-password" placeholder="Contraseña" onkeypress="if(event.key === 'Enter') loginRestaurante()">
        <button type="button" onclick="mostrarOcultarPassword()">👁</button>
      </div>
      <button id="boton-entrar-login" onclick="loginRestaurante()">Entrar</button>


      <p id="error-login"></p>
    </div>
  </div>

  

  <script>
    const API_URL = "https://gofood-api-production.up.railway.app";

    const traducciones = {
      es: {
        botonRestaurantes: "🍽️ Restaurantes",
        botonIdioma: "🌐 English",
        buscarPlaceholder: "Buscá por nombre o tipo de comida...",
        botonBuscar: "Buscar",
        soloAbiertos: "Solo abiertos",
        ordenPrecioDefault: "Ordenar platos por precio",
        ordenPrecioAsc: "Precio: menor a mayor",
        ordenPrecioDesc: "Precio: mayor a menor",
        botonCercania: "📍 Ordenar por cercanía",
        botonCercaniaObteniendo: "📍 Obteniendo ubicación...",
        botonCercaniaListo: "📍 Ordenado por cercanía ✓",
        tituloAbiertos: "Restaurantes abiertos ahora",
        sinAbiertos: "No hay restaurantes abiertos en este momento.",
        errorConexion: "No se pudo conectar con la API.",
        sinResultados: "No se encontraron resultados.",
        abierto: "Abierto",
        cerrado: "Cerrado",
        en: "En",
        tituloLogin: "Iniciar sesión - Restaurantes",
        placeholderEmail: "Email",
        placeholderPassword: "Contraseña",
        botonEntrar: "Entrar",
        errorLogin: "Email o contraseña incorrectos",
        errorGeo: "Tu navegador no soporta geolocalización.",
        errorGeoPermiso: "No se pudo obtener tu ubicación. Revisá los permisos del navegador.",
        temaOscuro: "🌙 Modo oscuro",
        temaClaro: "☀️ Modo claro"
      },
      en: {
        botonRestaurantes: "🍽️ Restaurants",
        botonIdioma: "🌐 Español",
        buscarPlaceholder: "Search by name or type of food...",
        botonBuscar: "Search",
        soloAbiertos: "Open now only",
        ordenPrecioDefault: "Sort dishes by price",
        ordenPrecioAsc: "Price: low to high",
        ordenPrecioDesc: "Price: high to low",
        botonCercania: "📍 Sort by distance",
        botonCercaniaObteniendo: "📍 Getting location...",
        botonCercaniaListo: "📍 Sorted by distance ✓",
        tituloAbiertos: "Open restaurants now",
        sinAbiertos: "There are no open restaurants right now.",
        errorConexion: "Could not connect to the API.",
        sinResultados: "No results found.",
        abierto: "Open",
        cerrado: "Closed",
        en: "At",
        tituloLogin: "Log in - Restaurants",
        placeholderEmail: "Email",
        placeholderPassword: "Password",
        botonEntrar: "Log in",
        errorLogin: "Incorrect email or password",
        errorGeo: "Your browser does not support geolocation.",
        errorGeoPermiso: "Could not get your location. Check your browser permissions.",
        temaOscuro: "🌙 Dark mode",
        temaClaro: "☀️ Light mode"
      }
    };

    let idiomaActual = localStorage.getItem("idioma") || "es";

    function aplicarIdioma(idioma) {
      idiomaActual = idioma;
      localStorage.setItem("idioma", idioma);
      const t = traducciones[idioma];

      document.getElementById("boton-mostrar-login").textContent = t.botonRestaurantes;
      document.getElementById("boton-idioma").textContent = t.botonIdioma;
      document.getElementById("buscar").placeholder = t.buscarPlaceholder;
      document.getElementById("boton-buscar").textContent = t.botonBuscar;
      document.getElementById("texto-solo-abiertos").textContent = t.soloAbiertos;
      document.getElementById("opcion-precio-default").textContent = t.ordenPrecioDefault;
      document.getElementById("opcion-precio-asc").textContent = t.ordenPrecioAsc;
      document.getElementById("opcion-precio-desc").textContent = t.ordenPrecioDesc;
      document.getElementById("boton-cercania").textContent = t.botonCercania;
      document.getElementById("titulo-abiertos").textContent = t.tituloAbiertos;
      document.getElementById("titulo-login").textContent = t.tituloLogin;
      document.getElementById("login-email").placeholder = t.placeholderEmail;
      document.getElementById("login-password").placeholder = t.placeholderPassword;
      document.getElementById("boton-entrar-login").textContent = t.botonEntrar;

      const temaActualAhora = document.documentElement.getAttribute("data-tema");
      document.getElementById("boton-tema").textContent = temaActualAhora === "oscuro" ? t.temaClaro : t.temaOscuro;

      cargarAbiertos();
      if (document.getElementById("buscar").value) buscar();
    }

    function cambiarIdioma() {
      aplicarIdioma(idiomaActual === "es" ? "en" : "es");
    }

    async function cargarAbiertos() {
      const t = traducciones[idiomaActual];
      try {
        const response = await fetch(`${API_URL}/api/restaurants?openOnly=true`);
        const restaurantes = await response.json();

        const listaEl = document.getElementById("lista-abiertos");

        if (restaurantes.length === 0) {
          listaEl.innerHTML = `<p>${t.sinAbiertos}</p>`;
          return;
        }

        
        listaEl.innerHTML = restaurantes.map(r => `
          <div class="resultado">
                        <h3><a href="restaurante.html?id=${r.id}">${r.logoUrl ? `<img class="logo-mini" src="${r.logoUrl}">` : ""}${r.name}</a></h3>
            <p>${r.address} — <span class="estado-abierto">${t.abierto}</span></p>
          </div>
        `).join("");


    


           } catch (err) {
        document.getElementById("lista-abiertos").innerHTML = `<p>${t.errorConexion}</p>`;
      }
    }






    let ubicacionUsuario = null;

        function activarCercania() {
      const t = traducciones[idiomaActual];
      const boton = document.getElementById("boton-cercania");

      if (!navigator.geolocation) {
        alert(t.errorGeo);
        return;
      }

      boton.textContent = t.botonCercaniaObteniendo;
      boton.disabled = true;

      navigator.geolocation.getCurrentPosition(
        (posicion) => {
          ubicacionUsuario = {
            lat: posicion.coords.latitude,
            lng: posicion.coords.longitude
          };
          boton.textContent = t.botonCercaniaListo;
          boton.disabled = false;
          buscar();
        },
        (error) => {
          alert(t.errorGeoPermiso);
          boton.textContent = t.botonCercania;
          boton.disabled = false;
        }
      );
    }






      async function buscar() {
      const t = traducciones[idiomaActual];
      const q = document.getElementById("buscar").value;
      const resultadosEl = document.getElementById("resultados");
      resultadosEl.innerHTML = "";

      sessionStorage.setItem("busqueda-q", q);
      sessionStorage.setItem("busqueda-abiertos", document.getElementById("solo-abiertos").checked);
      sessionStorage.setItem("busqueda-precio", document.getElementById("orden-precio").value);

      if (!q) {


        document.getElementById("filtros").style.display = "none";
        document.getElementById("seccion-abiertos").style.display = "block";
        return;
      }

      document.getElementById("filtros").style.display = "block";
      document.getElementById("seccion-abiertos").style.display = "none";

      const soloAbiertos = document.getElementById("solo-abiertos").checked;
      const sortPrice = document.getElementById("orden-precio").value;
            let url = `${API_URL}/api/search?q=${encodeURIComponent(q)}&openOnly=${soloAbiertos}&sortPrice=${sortPrice}`;
      if (ubicacionUsuario) {
        url += `&userLat=${ubicacionUsuario.lat}&userLng=${ubicacionUsuario.lng}`;
      }
      const response = await fetch(url);
      const data = await response.json();

      
      if (data.restaurants.length === 0 && data.menuItems.length === 0) {
        resultadosEl.innerHTML = `<p>${t.sinResultados}</p>`;
        return;
      }

      
      data.restaurants.forEach(r => {
        resultadosEl.innerHTML += `
          <div class="resultado">
            <h3><a href="restaurante.html?id=${r.id}">${r.logoUrl ? `<img class="logo-mini" src="${r.logoUrl}">` : ""}${r.name}</a></h3>
            <p>${r.address} — ${r.isOpen ? `<span class='estado-abierto'>${t.abierto}</span>` : `<span class='estado-cerrado'>${t.cerrado}</span>`}</p>
          </div>
        `;
      });



                        data.menuItems.forEach(m => {
        if (sortPrice) {
          resultadosEl.innerHTML += `
            <div class="resultado">
              <h3><a href="restaurante.html?id=${m.restaurantId}">${m.name} - $${m.price}</a></h3>
              <p>${m.description ?? ""}</p>
                            <p><em style="color: var(--acento);">${t.en}: ${m.restaurantName}</em></p>
            </div>
          `;
        } else {



          resultadosEl.innerHTML += `
            <div class="resultado">
              <h3>${m.restaurantName}</h3>
              <p>${m.description ?? ""}</p>
              <p><a href="restaurante.html?id=${m.restaurantId}">${m.name} - $${m.price}</a></p>
            </div>
          `;
        }
      });
    }

        function mostrarLogin() {
      document.getElementById("login-restaurante").classList.toggle("activo");
    }

    function mostrarOcultarPassword() {
      const campo = document.getElementById("login-password");
      campo.type = campo.type === "password" ? "text" : "password";
    }

    async function loginRestaurante() {
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;
      const errorEl = document.getElementById("error-login");
      errorEl.textContent = "";

      try {
        const response = await fetch(`${API_URL}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

                if (!response.ok) {
          errorEl.textContent = traducciones[idiomaActual].errorLogin;
          return;
        }

        const data = await response.json();
        sessionStorage.setItem("token", data.token);
        window.location.href = "panel-restaurante.html";
      } catch (err) {
        errorEl.textContent = traducciones[idiomaActual].errorConexion;
      }
    }

        function aplicarTema(tema) {
      document.documentElement.setAttribute("data-tema", tema);
      const t = traducciones[idiomaActual];
      document.getElementById("boton-tema").textContent = tema === "oscuro" ? t.temaClaro : t.temaOscuro;
      localStorage.setItem("tema", tema);
    }

    function cambiarTema() {
      const temaActual = document.documentElement.getAttribute("data-tema");
      aplicarTema(temaActual === "oscuro" ? "claro" : "oscuro");
    }

    aplicarTema(localStorage.getItem("tema") || "claro");
    aplicarIdioma(idiomaActual);

        function restaurarBusqueda() {
      const qGuardado = sessionStorage.getItem("busqueda-q");
      if (!qGuardado) return;

      document.getElementById("buscar").value = qGuardado;
      document.getElementById("filtros").style.display = "block";
      document.getElementById("seccion-abiertos").style.display = "none";
      document.getElementById("solo-abiertos").checked = sessionStorage.getItem("busqueda-abiertos") === "true";
      document.getElementById("orden-precio").value = sessionStorage.getItem("busqueda-precio") || "";
      buscar();
    }

    setInterval(cargarAbiertos, 30000);
    restaurarBusqueda();
  </script>

</body>
</html>
