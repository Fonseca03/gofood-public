<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoFood</title>
  <style>
        :root {
      --fondo: #FAF6EF;
      --texto: #2A2420;
      --acento: #FF8000;
      --acento-claro: #FFA01A;
      --acento-oscuro: #E66800;
      --acento-texto: #FFFFFF;
      --abierto: #96E600;
      --cerrado: #A13D3D;
      --borde: #E4DACB;
    }
    [data-tema="oscuro"] {
      --fondo: #121212;
      --texto: #EFEFEF;
      --acento: #FFA01A;
      --acento-claro: #FFB84D;
      --acento-oscuro: #FF8000;
      --acento-texto: #121212;
      --abierto: #96E600;
      --cerrado: #C97070;
      --borde: #2E2E2E;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: var(--fondo);
      color: var(--texto);
      transition: background 0.2s, color 0.2s;
    }
    img { max-width: 200px; margin: 5px; border-radius: 8px; }
    .plato {
      border-bottom: 1px solid var(--borde);
      padding: 10px 0;
    }
    a.volver {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--texto);
    }
    .estado-abierto { color: var(--abierto); font-weight: bold; }
    .estado-cerrado { color: var(--cerrado); font-weight: bold; }
        
    .boton-llegar {
      display: block;
      width: fit-content;
      background: linear-gradient(180deg, var(--acento-claro), var(--acento-oscuro));
      color: var(--acento-texto);
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 8px;
      font-weight: bold;
      box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.25);
      transform: scale(1);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    
    .boton-llegar:hover { opacity: 0.95; }
    .boton-llegar:active {
      transform: scale(0.97);
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.35);
    }
    

    .boton-redes {
      display: block;
      width: fit-content;
      background: transparent;
      border: 2px solid var(--acento);
      color: var(--acento);
      padding: 8px 18px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
      transition: background 0.15s, color 0.15s;
    }

    .boton-redes:hover {
      background: var(--acento);
      color: var(--acento-texto);
    }
    


    #banner-portada {
      position: relative;
      left: 50%;
      width: 100vw;
      margin-left: -50vw;
      height: 320px;
      overflow: hidden;
      background: var(--fondo);
      margin-bottom: 60px;
    }
    

    .banner-fondo {
      max-width: none;
      width: 100%;
      height: 100%;
      margin: 0;
      border-radius: 0;
      object-fit: cover;
      object-position: center;
      filter: blur(4px);
      opacity: 0.15;
      display: none;
    }

    
    .banner-titulo {
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 100%;
      text-align: center;
      margin: 0;
      color: var(--texto);
      font-size: 32px;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }


    #boton-tema {
      background: rgba(255, 255, 255, 0.85);
      color: var(--texto);
      border: 1px solid var(--borde);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      position: absolute;
      top: 10px;
      right: 10px;
    }
    
    .banner-avatar {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      max-width: none;
      width: 90px;
      height: 90px;
      margin: 0;
      border-radius: 50%;
      border: 4px solid var(--fondo);
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: none;
    }



  </style>



</head>
<body>


  <div id="banner-portada">
    <img id="banner-imagen" class="banner-fondo" src="" alt="">
    <button id="boton-tema" onclick="cambiarTema()">🌙 Modo oscuro</button>
    <img id="banner-avatar" class="banner-avatar" src="" alt="Logo">
    <h1 id="banner-titulo" class="banner-titulo"></h1>
  </div>

  <a class="volver" href="index.html">← Volver a la búsqueda</a>



  <div id="contenido">Cargando...</div>

  <script>
    const API_URL = "https://gofood-api-production.up.railway.app";

    // Sacamos el id del restaurante de la URL, por ejemplo: restaurante.html?id=abc-123
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function cargarDetalle() {
      if (!id) {
        document.getElementById("contenido").innerHTML = "<p>No se especificó un restaurante.</p>";
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/restaurants/${id}`);

        if (!response.ok) {
          document.getElementById("contenido").innerHTML = "<p>No se encontró el restaurante.</p>";
          return;
        }

        
        const r = await response.json();
        const claseEstado = r.isOpen ? "estado-abierto" : "estado-cerrado";
        const textoEstado = r.isOpen ? "Abierto" : "Cerrado";

        document.getElementById("banner-titulo").textContent = r.name;
        if (r.logoUrl) {
          document.getElementById("banner-imagen").src = r.logoUrl;
          document.getElementById("banner-imagen").style.display = "block";
          document.getElementById("banner-avatar").src = r.logoUrl;
          document.getElementById("banner-avatar").style.display = "block";
        }

        let html = `<p>${r.description ?? "Sin descripción"}</p>`;



        // Validación de Dirección
        const direccionTexto = r.address && r.address.trim() !== "" ? r.address : "No especificada";
        html += `<p><strong>Dirección:</strong> ${direccionTexto}</p>`;
        
        // Validación de WhatsApp / Teléfono
        if (r.phone && r.phone.trim() !== "") {
          const telefonoLimpio = r.phone.replace(/[^0-9]/g, "");
          const linkWhatsapp = `https://wa.me/${telefonoLimpio}`;
          html += `<p><strong>WhatsApp:</strong> <a href="${linkWhatsapp}" target="_blank" style="color: var(--acento); text-decoration: none;">${r.phone}</a></p>`;
        } else {
          html += `<p><strong>WhatsApp:</strong> No especificado</p>`;
        }

        html += `<p><strong>Estado:</strong> <span class="${claseEstado}">${textoEstado}</span></p>`;

                const tieneRedes = r.tikTokLink || r.instagramLink || r.facebookLink;
        if (tieneRedes) {

          html += `<button type="button" class="boton-redes" onclick="mostrarRedes()">Redes sociales</button>`;

          html += `<div id="redes-sociales" style="display: none; margin-top: 10px;">`;
          if (r.tikTokLink) {
            html += `<p><strong>TikTok:</strong> <a href="${r.tikTokLink}" target="_blank">${r.tikTokLink}</a></p>`;
          }
          if (r.instagramLink) {
            html += `<p><strong>Instagram:</strong> <a href="${r.instagramLink}" target="_blank">${r.instagramLink}</a></p>`;
          }
          if (r.facebookLink) {
            html += `<p><strong>Facebook:</strong> <a href="${r.facebookLink}" target="_blank">${r.facebookLink}</a></p>`;
          }
          html += `</div>`;
        }

        // Validación de Coordenadas para el botón "Cómo llegar"
        if (r.latitude != null && r.longitude != null) {
          const linkMaps = `https://www.google.com/maps/search/?api=1&query=${r.latitude},${r.longitude}`;
          html += `<a class="boton-llegar" href="${linkMaps}" target="_blank">📍 Cómo llegar</a>`;
        }

        html += `<h2>Fotos del menú</h2>`;
        if (r.menuPhotos.length === 0) {
          html += `<p>No hay fotos cargadas.</p>`;
        } else {
          r.menuPhotos.forEach(foto => {
            html += `<img src="${foto.url}">`;
          });
        }

        html += `<h2>Platos</h2>`;
        if (r.menuItems.length === 0) {
          html += `<p>No hay platos cargados.</p>`;
        } else {
          r.menuItems.forEach(item => {
            html += `<div class="plato"><strong>${item.name}</strong> - $${item.price}<br>${item.description ?? ""}</div>`;
          });
        }

        document.getElementById("contenido").innerHTML = html;
      } catch (err) {
        document.getElementById("contenido").innerHTML = "<p>No se pudo conectar con la API.</p>";
      }
    }

        function mostrarRedes() {
      const div = document.getElementById("redes-sociales");
      div.style.display = div.style.display === "none" ? "block" : "none";
    }

    function aplicarTema(tema) {
      document.documentElement.setAttribute("data-tema", tema);
      document.getElementById("boton-tema").textContent = tema === "oscuro" ? "☀️ Modo claro" : "🌙 Modo oscuro";
      localStorage.setItem("tema", tema);
    }

    function cambiarTema() {
      const temaActual = document.documentElement.getAttribute("data-tema");
      aplicarTema(temaActual === "oscuro" ? "claro" : "oscuro");
    }

    aplicarTema(localStorage.getItem("tema") || "claro");

    cargarDetalle();
  </script>

</body>
</html>
