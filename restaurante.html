<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GoFood</title>
  <style>
        :root {
      --fondo: #FAF6EF;
      --texto: #2A2420;
      --acento: #FF8000;
      --acento-claro: #FFA01A;
      --acento-oscuro: #E66800;
      --acento-texto: #FFFFFF;
      --abierto: #96E600;
      --cerrado: #A13D3D;
      --borde: #E4DACB;
    }
    [data-tema="oscuro"] {
      --fondo: #121212;
      --texto: #EFEFEF;
      --acento: #FFA01A;
      --acento-claro: #FFB84D;
      --acento-oscuro: #FF8000;
      --acento-texto: #121212;
      --abierto: #96E600;
      --cerrado: #C97070;
      --borde: #2E2E2E;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: var(--fondo);
      color: var(--texto);
      transition: background 0.2s, color 0.2s;
    }
    img { max-width: 200px; margin: 5px; border-radius: 8px; }
    .plato {
      border-bottom: 1px solid var(--borde);
      padding: 10px 0;
    }
    a.volver {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--texto);
    }
    .estado-abierto { color: var(--abierto); font-weight: bold; }
    .estado-cerrado { color: var(--cerrado); font-weight: bold; }
        
    .boton-llegar {
      display: block;
      width: fit-content;
      background: linear-gradient(180deg, var(--acento-claro), var(--acento-oscuro));
      color: var(--acento-texto);
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 8px;
      font-weight: bold;
      box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.25);
      transform: scale(1);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    
    .boton-llegar:hover { opacity: 0.95; }
    .boton-llegar:active {
      transform: scale(0.97);
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.35);
    }
    

    .boton-redes {
      display: block;
      width: fit-content;
      background: transparent;
      border: 2px solid var(--acento);
      color: var(--acento);
      padding: 8px 18px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
      transition: background 0.15s, color 0.15s;
    }

    .boton-redes:hover {
      background: var(--acento);
      color: var(--acento-texto);
    }
    


    #banner-portada {
      position: relative;
      left: 50%;
      width: 100vw;
      margin-left: -50vw;
      height: 320px;
      overflow: hidden;
      background: var(--fondo);
      margin-bottom: 60px;
    }
    

    .banner-fondo {
      max-width: none;
      width: 100%;
      height: 100%;
      margin: 0;
      border-radius: 0;
      object-fit: cover;
      object-position: center;
      filter: blur(4px);
      opacity: 0.15;
      display: none;
    }

    
    .banner-titulo {
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 100%;
      text-align: center;
      margin: 0;
      color: var(--texto);
      font-size: 32px;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }


        #boton-tema, #boton-idioma {
      background: rgba(255, 255, 255, 0.85);
      color: var(--texto);
      border: 1px solid var(--borde);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .banner-avatar {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      max-width: none;
      width: 90px;
      height: 90px;
      margin: 0;
      border-radius: 50%;
      border: 4px solid var(--fondo);
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: none;
    }



  </style>



</head>
<body>


    <div id="banner-portada">
    <img id="banner-imagen" class="banner-fondo" src="" alt="">
    <div style="position: absolute; top: 10px; right: 10px; display: flex; gap: 8px;">
      <button id="boton-idioma" onclick="cambiarIdioma()">🌐 English</button>
      <button id="boton-tema" onclick="cambiarTema()">🌙 Modo oscuro</button>
    </div>
    <img id="banner-avatar" class="banner-avatar" src="" alt="Logo">
    <h1 id="banner-titulo" class="banner-titulo"></h1>
  </div>

  <a class="volver" id="link-volver" href="index.html">← Volver a la búsqueda</a>



  <div id="contenido">Cargando...</div>

    <script>
    const API_URL = "https://gofood-api-production.up.railway.app";

    const traducciones = {
      es: {
        linkVolver: "← Volver a la búsqueda",
        temaOscuro: "🌙 Modo oscuro",
        temaClaro: "☀️ Modo claro",
        botonIdioma: "🌐 English",
        sinId: "No se especificó un restaurante.",
        noEncontrado: "No se encontró el restaurante.",
        sinDescripcion: "Sin descripción",
        direccion: "Dirección:",
        direccionNoEspecificada: "No especificada",
        whatsapp: "WhatsApp:",
        whatsappNoEspecificado: "No especificado",
        estado: "Estado:",
        abierto: "Abierto",
        cerrado: "Cerrado",
        redesSociales: "Redes sociales",
        comoLlegar: "📍 Cómo llegar",
        fotosMenu: "Fotos del menú",
        sinFotos: "No hay fotos cargadas.",
        platos: "Platos",
        sinPlatos: "No hay platos cargados.",
        errorConexion: "No se pudo conectar con la API."
      },
      en: {
        linkVolver: "← Back to search",
        temaOscuro: "🌙 Dark mode",
        temaClaro: "☀️ Light mode",
        botonIdioma: "🌐 Español",
        sinId: "No restaurant was specified.",
        noEncontrado: "Restaurant not found.",
        sinDescripcion: "No description",
        direccion: "Address:",
        direccionNoEspecificada: "Not specified",
        whatsapp: "WhatsApp:",
        whatsappNoEspecificado: "Not specified",
        estado: "Status:",
        abierto: "Open",
        cerrado: "Closed",
        redesSociales: "Social media",
        comoLlegar: "📍 Get directions",
        fotosMenu: "Menu photos",
        sinFotos: "No photos uploaded yet.",
        platos: "Dishes",
        sinPlatos: "No dishes added yet.",
        errorConexion: "Could not connect to the API."
      }
    };

    let idiomaActual = localStorage.getItem("idioma") || "es";
    let restauranteActual = null;

    // Sacamos el id del restaurante de la URL, por ejemplo: restaurante.html?id=abc-123
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function cargarDetalle() {
      const t = traducciones[idiomaActual];

      if (!id) {
        document.getElementById("contenido").innerHTML = `<p>${t.sinId}</p>`;
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/restaurants/${id}`);

        if (!response.ok) {
          document.getElementById("contenido").innerHTML = `<p>${t.noEncontrado}</p>`;
          return;
        }

        restauranteActual = await response.json();
        renderizarDetalle();
      } catch (err) {
        document.getElementById("contenido").innerHTML = `<p>${t.errorConexion}</p>`;
      }
    }

    function renderizarDetalle() {
      if (!restauranteActual) return;
      const t = traducciones[idiomaActual];
      const r = restauranteActual;
      const claseEstado = r.isOpen ? "estado-abierto" : "estado-cerrado";
      const textoEstado = r.isOpen ? t.abierto : t.cerrado;

      document.getElementById("banner-titulo").textContent = r.name;
      if (r.logoUrl) {
        document.getElementById("banner-imagen").src = r.logoUrl;
        document.getElementById("banner-imagen").style.display = "block";
        document.getElementById("banner-avatar").src = r.logoUrl;
        document.getElementById("banner-avatar").style.display = "block";
      }

      let html = `<p>${r.description ?? t.sinDescripcion}</p>`;

      const direccionTexto = r.address && r.address.trim() !== "" ? r.address : t.direccionNoEspecificada;
      html += `<p><strong>${t.direccion}</strong> ${direccionTexto}</p>`;

      if (r.phone && r.phone.trim() !== "") {
        const telefonoLimpio = r.phone.replace(/[^0-9]/g, "");
        const linkWhatsapp = `https://wa.me/${telefonoLimpio}`;
        html += `<p><strong>${t.whatsapp}</strong> <a href="${linkWhatsapp}" target="_blank" style="color: var(--acento); text-decoration: none;">${r.phone}</a></p>`;
      } else {
        html += `<p><strong>${t.whatsapp}</strong> ${t.whatsappNoEspecificado}</p>`;
      }

      html += `<p><strong>${t.estado}</strong> <span class="${claseEstado}">${textoEstado}</span></p>`;

      const tieneRedes = r.tikTokLink || r.instagramLink || r.facebookLink;
      if (tieneRedes) {
        html += `<button type="button" class="boton-redes" onclick="mostrarRedes()">${t.redesSociales}</button>`;

        html += `<div id="redes-sociales" style="display: none; margin-top: 10px;">`;
        if (r.tikTokLink) {
          html += `<p><strong>TikTok:</strong> <a href="${r.tikTokLink}" target="_blank">${r.tikTokLink}</a></p>`;
        }
        if (r.instagramLink) {
          html += `<p><strong>Instagram:</strong> <a href="${r.instagramLink}" target="_blank">${r.instagramLink}</a></p>`;
        }
        if (r.facebookLink) {
          html += `<p><strong>Facebook:</strong> <a href="${r.facebookLink}" target="_blank">${r.facebookLink}</a></p>`;
        }
        html += `</div>`;
      }

      if (r.latitude != null && r.longitude != null) {
        const linkMaps = `https://www.google.com/maps/search/?api=1&query=${r.latitude},${r.longitude}`;
        html += `<a class="boton-llegar" href="${linkMaps}" target="_blank">${t.comoLlegar}</a>`;
      }

      html += `<h2>${t.fotosMenu}</h2>`;
      if (r.menuPhotos.length === 0) {
        html += `<p>${t.sinFotos}</p>`;
      } else {
        r.menuPhotos.forEach(foto => {
          html += `<img src="${foto.url}">`;
        });
      }

      html += `<h2>${t.platos}</h2>`;
      if (r.menuItems.length === 0) {
        html += `<p>${t.sinPlatos}</p>`;
      } else {
        r.menuItems.forEach(item => {
          html += `<div class="plato"><strong>${item.name}</strong> - $${item.price}<br>${item.description ?? ""}</div>`;
        });
      }

      document.getElementById("contenido").innerHTML = html;
    }

    function mostrarRedes() {
      const div = document.getElementById("redes-sociales");
      div.style.display = div.style.display === "none" ? "block" : "none";
    }

    function aplicarTema(tema) {
      document.documentElement.setAttribute("data-tema", tema);
      const t = traducciones[idiomaActual];
      document.getElementById("boton-tema").textContent = tema === "oscuro" ? t.temaClaro : t.temaOscuro;
      localStorage.setItem("tema", tema);
    }

    function cambiarTema() {
      const temaActual = document.documentElement.getAttribute("data-tema");
      aplicarTema(temaActual === "oscuro" ? "claro" : "oscuro");
    }

    function aplicarIdioma(idioma) {
      idiomaActual = idioma;
      localStorage.setItem("idioma", idioma);
      const t = traducciones[idioma];

      document.getElementById("link-volver").textContent = t.linkVolver;
      document.getElementById("boton-idioma").textContent = t.botonIdioma;

      const temaActualAhora = document.documentElement.getAttribute("data-tema");
      document.getElementById("boton-tema").textContent = temaActualAhora === "oscuro" ? t.temaClaro : t.temaOscuro;

      if (restauranteActual) {
        renderizarDetalle();
      }
    }

    function cambiarIdioma() {
      aplicarIdioma(idiomaActual === "es" ? "en" : "es");
    }

    aplicarTema(localStorage.getItem("tema") || "claro");
    aplicarIdioma(idiomaActual);

    cargarDetalle();
  </script>

</body>
</html>
