<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <title>Ubik</title>
  <style>
        :root {
      --fondo: #FAF6EF;
      --texto: #2A2420;
      --acento: #1A7F90;
      --acento-claro: #2A9DAE;
      --acento-oscuro: #0F6577;
      --acento-texto: #FFFFFF;
      --abierto: #96E600;
      --cerrado: #A13D3D;
      --borde: #E4DACB;
    }
    [data-tema="oscuro"] {
      --fondo: #121212;
      --texto: #EFEFEF;
      --acento: #3FBFD0;
      --acento-claro: #6AD3E0;
      --acento-oscuro: #2AA3B5;
      --acento-texto: #121212;
      --abierto: #96E600;
      --cerrado: #C97070;
      --borde: #2E2E2E;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      background: var(--fondo);
      color: var(--texto);
      transition: background 0.2s, color 0.2s;
    }
    img { max-width: 200px; margin: 5px; border-radius: 8px; }
        .plato {
      border: 1px solid var(--borde);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 16px;
      background: rgba(127, 127, 127, 0.06);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }
    .plato-foto {
      margin: 0;
      border-radius: 10px;
      max-width: none;
    }
    /* Estilo tarjetas: foto grande arriba */
    .plato:not(.horizontal) .plato-foto {
      display: block;
      width: 100%;
      max-height: 380px;
      object-fit: contain;
      background: rgba(127, 127, 127, 0.08);
      margin: 0 0 10px 0;
    }
    /* Estilo horizontal: foto chica a la izquierda, texto a la derecha */
    .plato.horizontal {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .plato.horizontal .plato-foto {
      width: 96px;
      height: 96px;
      object-fit: cover;
      flex-shrink: 0;
    }
    .plato-info { flex: 1; min-width: 0; }
    .nombre-local { margin: 4px 0 8px 0; font-size: 28px; font-weight: 800; line-height: 1.2; }
    .plato-nombre { font-size: 19px; line-height: 1.25; }
    .plato-precio { color: var(--acento); font-weight: bold; margin-top: 11px; }
    .plato-desc {
      white-space: pre-line;
      margin-top: 4px;
    }
        .nota-precio {
      font-size: 13px;
      opacity: 0.75;
    }
    .titulo-oferta { color: #d62828; margin: 16px 0 8px 0; }
    .video-embed { position: relative; width: 100%; padding-top: 56.25%; margin-bottom: 12px; border-radius: 10px; overflow: hidden; border: 2px solid #d62828; }
    .video-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .boton-oferta { display: inline-block; background: #d62828; color: #fff; font-weight: bold; padding: 12px 20px; border-radius: 8px; text-decoration: none; margin-bottom: 12px; }
    .etiqueta-oferta { display: inline-block; background: #d62828; color: #fff; font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 6px; margin-left: 6px; }
    .video-yt {
      position: relative;
      display: block;
      width: fit-content;
      margin: 8px 0;
    }
    .video-yt img {
      display: block;
      margin: 0;
      width: 100%;
      max-width: 320px;
    }
    .video-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
        a.volver {
      display: inline-block;
      margin-bottom: 20px;
      background: transparent;
      border: 2px solid var(--acento);
      color: var(--acento);
      padding: 8px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
      transition: background 0.15s, color 0.15s;
    }
    a.volver:hover {
      background: var(--acento);
      color: var(--acento-texto);
    }
    .estado-abierto { color: var(--abierto); font-weight: bold; }
    .estado-cerrado { color: var(--cerrado); font-weight: bold; }
        
    .boton-llegar {
      display: block;
      width: fit-content;
      background: linear-gradient(180deg, var(--acento-claro), var(--acento-oscuro));
      color: var(--acento-texto);
      padding: 10px 20px;
      font-size: 14px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 8px;
      font-weight: bold;
      box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.25);
      transform: scale(1);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    
    .boton-llegar:hover { opacity: 0.95; }
    .boton-llegar:active {
      transform: scale(0.97);
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.35);
    }
    

    .boton-redes {
      display: block;
      width: fit-content;
      background: transparent;
      border: 2px solid var(--acento);
      color: var(--acento);
      padding: 8px 18px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 8px;
      transition: background 0.15s, color 0.15s;
    }


    .boton-llegar.boton-contorno {
      background: transparent;
      border: 2px solid var(--acento);
      color: var(--acento);
      padding: 8px 18px;
      box-shadow: none;
    }
    .boton-llegar.boton-contorno:hover {
      background: var(--acento);
      color: var(--acento-texto);
      opacity: 1;
    }
    


    #banner-portada {
      position: relative;
      left: 50%;
      width: 100vw;
      margin-left: -50vw;
      height: 210px;
      overflow: hidden;
      background: transparent;
      margin-bottom: 56px;
    }
    

    .banner-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      max-width: none;
      margin: 0;
      border-radius: 0;
      object-fit: contain;
      object-position: center;
      filter: blur(4px);
      opacity: 0.15;
      display: none;
    }

    
    .banner-titulo {
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 100%;
      text-align: center;
      margin: 0;
      color: var(--texto);
      font-size: 32px;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }


        #boton-tema, #boton-idioma {
      background: rgba(255, 255, 255, 0.85);
      color: var(--texto);
      border: 1px solid var(--borde);
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    
    .banner-avatar {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      max-width: none;
      width: 90px;
      height: 90px;
      margin: 0;
      border-radius: 50%;
      border: 4px solid var(--fondo);
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: none;
    }



  </style>



</head>
<body>


    <div id="banner-portada">
    <img id="banner-imagen" class="banner-fondo" src="" alt="">
    <div style="position: absolute; top: 10px; right: 10px; display: flex; gap: 8px;">
      <button id="boton-idioma" onclick="cambiarIdioma()">🌐 English</button>
      <button id="boton-tema" onclick="cambiarTema()">🌙 Modo oscuro</button>
    </div>
    <img id="banner-avatar" class="banner-avatar" src="" alt="Logo">
  </div>

  <a class="volver" id="link-volver" href="index.html" onclick="if (history.length > 1) { history.back(); return false; }">← Volver  a la búsqueda</a>



  <h2 id="nombre-local" class="nombre-local"></h2>
  <div id="contenido">Cargando...</div>

    <script>
    const API_URL = "https://gofood-api-production.up.railway.app";

// ===== Tasa oficial del BCV (para mostrar el precio en Bs) =====
let tasaUsd = null;

function formatoBs(n) {
  const [entero, decimales] = n.toFixed(2).split(".");
  return entero.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + decimales;
}

function textoPrecio(usd) {
  const base = `$${Number(usd).toFixed(2)}`;
  if (!tasaUsd) return base;
  return `${base} · Bs ${formatoBs(Number(usd) * tasaUsd)}`;
}

fetch(`${API_URL}/api/tasa`)
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    tasaUsd = d.usd;
    // si la página ya se dibujó, la dibujamos de nuevo para que aparezcan los Bs
    try {
      if (document.getElementById("contenido").innerHTML.trim()) renderizarDetalle();
    } catch (e) {}
  })
  .catch(() => {});

    const traducciones = {
      es: {
        linkVolver: "← Volver a la búsqueda",
        temaOscuro: "🌙 Modo oscuro",
        temaClaro: "☀️ Modo claro",
        botonIdioma: "🌐 English",
        sinId: "No se especificó un restaurante.",
        noEncontrado: "No se encontró el restaurante.",
        sinDescripcion: "Sin descripción",
        direccion: "Dirección:",
        direccionNoEspecificada: "No especificada",
        whatsapp: "WhatsApp:",
        whatsappNoEspecificado: "No especificado",
        estado: "Estado:",
        abierto: "Abierto",
        cerrado: "Cerrado",
        redesSociales: "Redes sociales",
                comoLlegar: "📍 Cómo llegar",
        videos: "Videos",
        verVideo: "▶ Ver video",
        ofertas: "Ofertas",
        etiquetaOferta: "Oferta",
        verVideoOferta: "▶ Ver video de oferta",
        platos: "Catálogo",
        sinPlatos: "Todavía no hay nada en el catálogo.",
        notaPrecio: "Cada negocio define y actualiza sus propios precios. Ubik no se hace responsable por los precios publicados.",
        errorConexion: "No se pudo conectar con la API."
      },
      en: {
        linkVolver: "← Back to search",
        temaOscuro: "🌙 Dark mode",
        temaClaro: "☀️ Light mode",
        botonIdioma: "🌐 Español",
        sinId: "No restaurant was specified.",
        noEncontrado: "Restaurant not found.",
        sinDescripcion: "No description",
        direccion: "Address:",
        direccionNoEspecificada: "Not specified",
        whatsapp: "WhatsApp:",
        whatsappNoEspecificado: "Not specified",
        estado: "Status:",
        abierto: "Open",
        cerrado: "Closed",
        redesSociales: "Social media",
        comoLlegar: "📍 Get directions",
        videos: "Videos",
        verVideo: "▶ Watch video",
        ofertas: "Offers",
        etiquetaOferta: "Offer",
        verVideoOferta: "▶ Watch offer video",
        platos: "Catalog",
        sinPlatos: "Nothing in the catalog yet.",
        notaPrecio: "Each business sets and updates its own prices. Ubik is not responsible for the published prices.",
        errorConexion: "Could not connect to the API."
      }
    };

    let idiomaActual = localStorage.getItem("idioma") || "es";
    let restauranteActual = null;

    // Sacamos el id del restaurante de la URL, por ejemplo: restaurante.html?id=abc-123
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    async function cargarDetalle() {
      const t = traducciones[idiomaActual];

      if (!id) {
        document.getElementById("contenido").innerHTML = `<p>${t.sinId}</p>`;
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/restaurants/${id}`);

        if (!response.ok) {
          document.getElementById("contenido").innerHTML = `<p>${t.noEncontrado}</p>`;
          return;
        }

        restauranteActual = await response.json();

        // Si este local tiene oferta, queda "visto": se apagan sus luces azules hasta cerrar la app
        if (restauranteActual.offerVideoLink || (restauranteActual.menuItems || []).some(m => m.isOffer)) {
          try {
            const vistas = JSON.parse(sessionStorage.getItem("ofertas-vistas") || "[]");
            if (!vistas.includes(restauranteActual.id)) vistas.push(restauranteActual.id);
            sessionStorage.setItem("ofertas-vistas", JSON.stringify(vistas));
          } catch (e) {}
        }
        renderizarDetalle();
      } catch (err) {
        document.getElementById("contenido").innerHTML = `<p>${t.errorConexion}</p>`;
      }
    }

    function renderizarDetalle() {
      if (!restauranteActual) return;
      const t = traducciones[idiomaActual];
      const r = restauranteActual;
      const claseEstado = r.isOpen ? "estado-abierto" : "estado-cerrado";
      const textoEstado = r.isOpen ? t.abierto : t.cerrado;

      document.getElementById("nombre-local").textContent = r.name;
      if (r.logoUrl) {
        document.getElementById("banner-imagen").src = r.logoUrl;
        document.getElementById("banner-imagen").style.display = "block";
        document.getElementById("banner-avatar").src = r.logoUrl;
        document.getElementById("banner-avatar").style.display = "block";
      }

      let html = `<p>${r.description ?? t.sinDescripcion}</p>`;

      const direccionTexto = r.address && r.address.trim() !== "" ? r.address : t.direccionNoEspecificada;
      html += `<p><strong>${t.direccion}</strong> ${direccionTexto}</p>`;

      if (r.phone && r.phone.trim() !== "") {
        const telefonoLimpio = r.phone.replace(/[^0-9]/g, "");
        const linkWhatsapp = `https://wa.me/${telefonoLimpio}`;
        html += `<p><strong>${t.whatsapp}</strong> <a href="${linkWhatsapp}" target="_blank" style="color: var(--acento); text-decoration: none;">${r.phone}</a></p>`;
      } else {
        html += `<p><strong>${t.whatsapp}</strong> ${t.whatsappNoEspecificado}</p>`;
      }

      html += `<p><strong>${t.estado}</strong> <span class="${claseEstado}">${textoEstado}</span></p>`;

      const tieneRedes = r.tikTokLink || r.instagramLink || r.facebookLink;
      if (tieneRedes) {
        html += `<button type="button" class="boton-redes" onclick="mostrarRedes()">${t.redesSociales}</button>`;

        html += `<div id="redes-sociales" style="display: none; margin-top: 10px;">`;
        if (r.tikTokLink) {
          html += `<p><strong>TikTok:</strong> <a href="${r.tikTokLink}" target="_blank">${r.tikTokLink}</a></p>`;
        }
        if (r.instagramLink) {
          html += `<p><strong>Instagram:</strong> <a href="${r.instagramLink}" target="_blank">${r.instagramLink}</a></p>`;
        }
        if (r.facebookLink) {
          html += `<p><strong>Facebook:</strong> <a href="${r.facebookLink}" target="_blank">${r.facebookLink}</a></p>`;
        }
        html += `</div>`;
      }

      if (r.latitude != null && r.longitude != null) {
        const linkMaps = `https://www.google.com/maps/search/?api=1&query=${r.latitude},${r.longitude}`;
        html += `<a class="boton-llegar boton-contorno" href="${linkMaps}" target="_blank">${t.comoLlegar}</a>`;
      }

      if (r.offerVideoLink) {
        const ytOferta = idYoutube(r.offerVideoLink);
        const hrefOferta = r.offerVideoLink.replace(/"/g, "%22");
        html += `<h2 class="titulo-oferta">🔥 ${t.ofertas}</h2>`;
        if (ytOferta) {
          html += `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${ytOferta}?autoplay=1&mute=1&playsinline=1&rel=0" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
        }
        html += `<a class="boton-oferta" href="${hrefOferta}" target="_blank">${t.verVideoOferta}</a>`;
      }

      const videos = r.videoLinks || [];
      if (videos.length > 0) {
        html += `<h2>${t.videos}</h2>`;
        videos.forEach(v => {
          const href = v.replace(/"/g, "%22");
          const yt = idYoutube(v);
          if (yt) {
            html += `<a class="video-yt" href="${href}" target="_blank"><img src="https://img.youtube.com/vi/${yt}/hqdefault.jpg" alt=""><span class="video-play">▶</span></a>`;
          } else {
            html += `<a class="boton-llegar" href="${href}" target="_blank">${t.verVideo}</a>`;
          }
        });
      }

           

            html += `<h2>${t.platos}</h2>`;
      const items = (r.menuItems || []).slice().sort((a, b) => (b.isOffer ? 1 : 0) - (a.isOffer ? 1 : 0));
      if (items.length === 0) {
        html += `<p>${t.sinPlatos}</p>`;
      } else {
        html += `<p class="nota-precio">${t.notaPrecio}</p>`;
        const claseEstilo = r.catalogStyle === 1 ? " horizontal" : "";
        items.forEach(item => {
          html += `<div class="plato${claseEstilo}">
            ${item.photoUrl ? `<img class="plato-foto" src="${item.photoUrl}" alt="">` : ""}
            <div class="plato-info">
              <strong class="plato-nombre">${item.name}</strong>${item.isOffer ? `<span class="etiqueta-oferta">${t.etiquetaOferta}</span>` : ""}
              <div class="plato-desc">${item.description ?? ""}</div>
              ${item.price > 0 ? `<div class="plato-precio">${textoPrecio(item.price)}</div>` : ""}
            </div>
          </div>`;
        });
      }

      document.getElementById("contenido").innerHTML = html;
    }

    function idYoutube(url) {
      try {
        const u = new URL(url);
        const h = u.hostname.toLowerCase();
        let idVideo = null;
        if (h === "youtu.be") {
          idVideo = u.pathname.slice(1).split("/")[0];
        } else if (h === "youtube.com" || h.endsWith(".youtube.com")) {
          if (u.pathname === "/watch") {
            idVideo = u.searchParams.get("v");
          } else {
            const m = u.pathname.match(/^\/(shorts|embed|live)\/([^/?]+)/);
            if (m) idVideo = m[2];
          }
        }
        return idVideo && /^[\w-]{6,20}$/.test(idVideo) ? idVideo : null;
      } catch (e) {
        return null;
      }
    }

    function mostrarRedes() {
      const div = document.getElementById("redes-sociales");
      div.style.display = div.style.display === "none" ? "block" : "none";
    }

    function aplicarTema(tema) {
      document.documentElement.setAttribute("data-tema", tema);
      const t = traducciones[idiomaActual];
      document.getElementById("boton-tema").textContent = tema === "oscuro" ? t.temaClaro : t.temaOscuro;
      localStorage.setItem("tema", tema);
    }

    function cambiarTema() {
      const temaActual = document.documentElement.getAttribute("data-tema");
      aplicarTema(temaActual === "oscuro" ? "claro" : "oscuro");
    }

    function aplicarIdioma(idioma) {
      idiomaActual = idioma;
      localStorage.setItem("idioma", idioma);
      const t = traducciones[idioma];

      document.getElementById("link-volver").textContent = t.linkVolver;
      document.getElementById("boton-idioma").textContent = t.botonIdioma;

      const temaActualAhora = document.documentElement.getAttribute("data-tema");
      document.getElementById("boton-tema").textContent = temaActualAhora === "oscuro" ? t.temaClaro : t.temaOscuro;

      if (restauranteActual) {
        renderizarDetalle();
      }
    }

    function cambiarIdioma() {
      aplicarIdioma(idiomaActual === "es" ? "en" : "es");
    }

    aplicarTema(localStorage.getItem("tema") || "claro");
    aplicarIdioma(idiomaActual);

    cargarDetalle();

    // Botón "atrás" del celular: volver a la búsqueda (solo en la app)
    (function () {
      const AppPlugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
      const enApp = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
      if (AppPlugin && enApp) {
        AppPlugin.addListener("backButton", () => {
          if (history.length > 1) history.back();
          else window.location.href = "index.html";
        });
      }
    })();
  </script>

</body>
</html>
