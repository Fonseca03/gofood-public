<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel del Restaurante</title>
  <style>
    :root {
      --fondo: #FAF6EF;
      --texto: #2A2420;
      --acento: #1A7F90;
      --acento-claro: #2A9DAE;
      --acento-oscuro: #0F6577;
      --acento-texto: #FFFFFF;
      --abierto: #96E600;
      --cerrado: #A13D3D;
      --borde: #E4DACB;
    }
    [data-tema="oscuro"] {
      --fondo: #121212;
      --texto: #EFEFEF;
      --acento: #3FBFD0;
      --acento-claro: #6AD3E0;
      --acento-oscuro: #2AA3B5;
      --acento-texto: #121212;
      --abierto: #96E600;
      --cerrado: #C97070;
      --borde: #2E2E2E;
    }
    body {
      font-family: 'Inter', Arial, sans-serif;
      max-width: 700px;
      margin: 0 auto 40px;
      padding: 0 20px;
      background: var(--fondo);
      color: var(--texto);
      transition: background 0.2s, color 0.2s;
    }
    input, select, textarea {
      display: block;
      margin-bottom: 10px;
      padding: 8px;
      width: 100%;
      box-sizing: border-box;
      background: var(--fondo);
      color: var(--texto);
      border: 1px solid var(--borde);
      border-radius: 4px;
      font-family: inherit;
      font-size: 1rem;
    }
    button {
      padding: 8px 18px;
      font-size: 14px;
      cursor: pointer;
      background: transparent;
      color: var(--acento);
      border: 2px solid var(--acento);
      border-radius: 4px;
      font-weight: bold;
      box-shadow: none;
      transform: scale(1);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #contenido button, #boton-mostrar-logo, #boton-estilo,
    #boton-agregar-plato, #boton-agregar-video, .plato-item button {
      background: transparent;
      border: 2px solid var(--acento);
      color: var(--acento);
      padding: 8px 18px;
      font-size: 14px;
      box-shadow: none;
    }
    button:active { transform: scale(0.97); }
    button:active { transform: scale(0.97); }
    #contenido button:hover, #boton-mostrar-logo:hover, #boton-estilo:hover,
    #boton-agregar-plato:hover, #boton-agregar-video:hover, .plato-item button:hover {
      background: var(--acento);
      color: var(--acento-texto);
      opacity: 1;
    }
    button:hover { background: var(--acento); color: var(--acento-texto); }
    input[type="file"]::file-selector-button {
      margin-right: 12px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background: transparent;
      color: var(--acento);
      border: 2px solid var(--acento);
      border-radius: 4px;
    }
    input[type="file"]::file-selector-button:hover {
      background: var(--acento);
      color: var(--acento-texto);
    }
    .estado-abierto { color: var(--abierto); font-weight: bold; }
    .estado-cerrado { color: var(--cerrado); font-weight: bold; }
    .campo { margin-bottom: 8px; }
    .campo strong { display: inline-block; width: 140px; }
        #error-carga, #error-perfil, #error-foto, #error-plato, #error-videos { color: var(--cerrado); }
    #exito-perfil, #exito-foto, #exito-plato, #exito-videos { color: var(--abierto); }
    #form-editar, #form-plato, #form-videos {
      display: none;
      border-top: 1px solid var(--borde);
      margin-top: 20px;
      padding-top: 20px;
    }
    .foto-menu { max-width: 150px; margin: 5px; border-radius: 8px; }
    #plato-foto { display: none; }
    .boton-elegir-foto {
      display: block; text-align: center; padding: 14px;
      border: 2px dashed var(--acento); border-radius: 10px;
      color: var(--acento); font-weight: bold; cursor: pointer; margin-bottom: 10px;
    }
    #plato-foto-preview {
      display: block; max-width: 100%; max-height: 260px;
      margin: 0 auto 10px; border-radius: 10px; object-fit: contain;
    }
    #caja-oferta {
      display: none; margin-bottom: 10px; padding: 10px;
      border: 2px solid #d62828; border-radius: 10px;
      color: #d62828; font-weight: bold; cursor: pointer;
    }
    #caja-oferta input { display: inline-block; width: auto; margin: 0 8px 0 0; vertical-align: middle; }
    .etiqueta-oferta {
      display: inline-block; background: #d62828; color: #fff;
      font-size: 12px; font-weight: bold; padding: 2px 8px;
      border-radius: 6px; margin-left: 6px;
    }
    .plato-item {
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    #banner-portada {
      position: relative;
      left: 50%;
      width: 100vw;
      margin-left: -50vw;
      height: 320px;
      overflow: hidden;
      background: transparent;
      margin-bottom: 60px;
    }
    .banner-fondo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
      max-width: none;
      margin: 0;
      border-radius: 0;
      object-fit: contain;
      object-position: center;
      filter: blur(4px);
      opacity: 0.15;
      display: none;
    }
    .banner-titulo {
      position: absolute;
      bottom: 50px;
      left: 0;
      width: 100%;
      text-align: center;
      margin: 0;
      color: var(--texto);
    }
    

    #boton-tema, #boton-idioma {
      background: rgba(255, 255, 255, 0.85);
      color: var(--texto);
      border: 1px solid var(--borde);
    }



    #boton-cerrar-sesion {
      background: rgba(255, 255, 255, 0.85);
      color: var(--texto);
      border: 1px solid var(--borde);
      position: absolute;
      top: 10px;
      left: 10px;
    }
    .banner-avatar {
      position: absolute;
      bottom: -40px;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 4px solid var(--fondo);
      object-fit: cover;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      display: none;
    }
  </style>
</head>

  <script>
    const API_URL = "https://gofood-api-production.up.railway.app";

// ===== Tasa oficial del BCV (para mostrar el precio en Bs) =====
let tasaUsd = null;

function formatoBs(n) {
  const [entero, decimales] = n.toFixed(2).split(".");
  return entero.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + decimales;
}

function textoPrecio(usd) {
  const base = `$${Number(usd).toFixed(2)}`;
  if (!tasaUsd) return base;
  return `${base} · Bs ${formatoBs(Number(usd) * tasaUsd)}`;
}

function actualizarVistaBs() {
  const el = document.getElementById("precio-bs");
  if (!el) return;
  const v = parseFloat(document.getElementById("plato-precio").value);
  el.textContent = (tasaUsd && !isNaN(v) && v >= 0) ? `≈ Bs ${formatoBs(v * tasaUsd)}` : "";
}

fetch(`${API_URL}/api/tasa`)
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    tasaUsd = d.usd;
    // si la lista de platos ya se dibujó, la dibujamos de nuevo para que aparezcan los Bs
    try { renderizarPlatos(); } catch (e) {}
    try { actualizarVistaBs(); } catch (e) {}
  })

    let idiomaActual = localStorage.getItem("idioma") || "es";

    async function cargarMiPerfil() {
      const t = traducciones[idiomaActual];
      try {
        const response = await fetch(`${API_URL}/api/restaurants/me`, {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
          sessionStorage.removeItem("token");
          window.location.href = "index.html";
          return;
        }

        miRestaurante = await response.json();
        renderizarPerfil();
      } catch (err) {
        document.getElementById("error-carga").textContent = t.errorConexion;
      }
    }

    function renderizarPerfil() {
      const t = traducciones[idiomaActual];
      const r = miRestaurante;
      const claseEstado = r.isOpen ? "estado-abierto" : "estado-cerrado";
      const textoEstado = r.isOpen ? t.abierto : t.cerrado;

      document.getElementById("contenido").innerHTML = `
        <h2>${r.name}</h2>
        <div class="campo"><strong>${t.descripcion}</strong> ${r.description ?? "-"}</div>
        <div class="campo"><strong>${t.direccion}</strong> ${r.address ?? "-"}</div>
        <div class="campo"><strong>${t.telefono}</strong> ${r.phone ?? "-"}</div>
        <div class="campo"><strong>TikTok:</strong> ${r.tikTokLink ?? "-"}</div>
        <div class="campo"><strong>Instagram:</strong> ${r.instagramLink ?? "-"}</div>
        <div class="campo"><strong>Facebook:</strong> ${r.facebookLink ?? "-"}</div>
        <div class="campo"><strong>${t.correoContacto}</strong> ${r.contactEmail ?? "-"}</div>

        <div class="campo"><strong>${t.estado}</strong> <span class="${claseEstado}">${textoEstado}</span></div>
        <button onclick="cambiarEstado()">${t.cambiarA} ${r.isOpen ? t.cerrado : t.abierto}</button>
        <button onclick="mostrarEdicionPerfil()">${t.editarPerfil}</button>
      `;

      renderizarLogo();
      renderizarPlatos();
      marcarEstilo();
    }

    function renderizarLogo() {
      const t = traducciones[idiomaActual];
      const contenedor = document.getElementById("logo-actual");
      const bannerImg = document.getElementById("banner-imagen");
      const avatarImg = document.getElementById("banner-avatar");

      if (miRestaurante.logoUrl) {
        contenedor.innerHTML = `<img class="foto-menu" src="${miRestaurante.logoUrl}">`;
        bannerImg.src = miRestaurante.logoUrl;
        bannerImg.style.display = "block";
        avatarImg.src = miRestaurante.logoUrl;
        avatarImg.style.display = "block";
      } else {
        contenedor.innerHTML = `<p>${t.sinLogo}</p>`;
        bannerImg.style.display = "none";
        avatarImg.style.display = "none";
      }

      if (miRestaurante.logoModStatus === 1 && miRestaurante.pendingLogoUrl) {
        contenedor.innerHTML += `<p style="color:#e6a700;">⏳ ${t.logoEnRevision}</p><img class="foto-menu" src="${miRestaurante.pendingLogoUrl}" style="opacity:.6;">`;
      } else if (miRestaurante.logoModStatus === 2) {
        contenedor.innerHTML += `<p style="color:#d33;">❌ ${t.logoRechazado}</p>`;
      }
    }

    function renderizarFotos() {
      const t = traducciones[idiomaActual];
      const galeria = document.getElementById("galeria-fotos");
      const fotos = miRestaurante.menuPhotos || [];

      if (fotos.length === 0) {
        galeria.innerHTML = `<p>${t.sinFotos}</p>`;
        return;
      }

      galeria.innerHTML = fotos.map(f => `
        <div style="display: inline-block; text-align: center;">
          <img class="foto-menu" src="${f.url}"><br>
          <button onclick="eliminarFoto('${f.id}')">${t.eliminar}</button>
        </div>
      `).join("");
    }

    function renderizarPlatos() {
      const t = traducciones[idiomaActual];
      const lista = document.getElementById("lista-platos");
      const platos = miRestaurante.menuItems || [];

      if (platos.length === 0) {
        lista.innerHTML = `<p>${t.sinPlatos}</p>`;
        return;
      }

      lista.innerHTML = platos.map(p => `
          <div class="plato-item">
          ${p.photoUrl ? `<img class="foto-menu" src="${p.photoUrl}"><br>` : ""}
          ${p.photoModStatus === 1 ? `<div style="color:#e6a700;">⏳ ${t.fotoEnRevision}</div>${p.pendingPhotoUrl ? `<img class="foto-menu" src="${p.pendingPhotoUrl}" style="opacity:.6;"><br>` : ""}` : ""}
          ${p.photoModStatus === 2 ? `<div style="color:#d33;">❌ ${t.fotoRechazada}</div>` : ""}
          <strong>${p.name}</strong>${p.isOffer ? `<span class="etiqueta-oferta">${t.etiquetaOferta}</span>` : ""}${p.price > 0 ? ` - ${textoPrecio(p.price)}` : ""}<br>
          <div style="white-space: pre-line;">${p.description ?? ""}</div>
          <button onclick="mostrarFormPlatoPorId('${p.id}')">${t.editar}</button>
          <button onclick="eliminarPlato('${p.id}')">${t.eliminar}</button>
        </div>
      `).join("");
    }

    function mostrarFormVideos() {
      const r = miRestaurante;
      const lista = r.videoLinks || [];
      document.getElementById("video-1").value = lista[0] || "";
      document.getElementById("video-2").value = lista[1] || "";
      document.getElementById("video-oferta").value = r.offerVideoLink || "";
      document.getElementById("error-videos").textContent = "";
      document.getElementById("exito-videos").textContent = "";
      const tt = traducciones[idiomaActual];
      document.getElementById("estado-videos").textContent =
        r.videosModStatus === 1 ? "⏳ " + tt.videosEnRevision :
        r.videosModStatus === 2 ? "❌ " + tt.videosRechazados : "";
      document.getElementById("form-videos").style.display = "block";
      window.scrollTo(0, document.body.scrollHeight);
    }

    function cancelarFormVideos() {
      document.getElementById("form-videos").style.display = "none";
    }

    async function guardarVideos() {
      const t = traducciones[idiomaActual];
      const errorEl = document.getElementById("error-videos");
      const exitoEl = document.getElementById("exito-videos");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      const videos = [
        document.getElementById("video-1").value.trim(),
        document.getElementById("video-2").value.trim()
      ].filter(v => v !== "");
      const oferta = document.getElementById("video-oferta").value.trim();

      const dominiosVideo = ["youtube.com", "youtu.be", "tiktok.com", "instagram.com"];
      const esValido = (v) => {
        try {
          const u = new URL(v);
          const h = u.hostname.toLowerCase();
          return u.protocol === "https:" && dominiosVideo.some(d => h === d || h.endsWith("." + d));
        } catch (e) {
          return false;
        }
      };
      if (!videos.every(esValido) || (oferta !== "" && !esValido(oferta))) {
        errorEl.textContent = t.videosInvalidos;
        return;
      }

      const r = miRestaurante;
      const body = {
        name: r.name,
        description: r.description ?? null,
        address: r.address,
        phone: r.phone,
        latitude: r.latitude,
        longitude: r.longitude,
        socialMediaLink: r.socialMediaLink ?? null,
        tikTokLink: r.tikTokLink ?? null,
        instagramLink: r.instagramLink ?? null,
        facebookLink: r.facebookLink ?? null,
        contactEmail: r.contactEmail ?? null,
        category: r.category,
        videoLinks: videos,
        offerVideoLink: oferta
      };

      const botonEl = document.getElementById("boton-guardar-videos");
      botonEl.disabled = true;

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          errorEl.textContent = t.noSePudoGuardarVideos;
          return;
        }
        await cargarMiPerfil();
        exitoEl.textContent = miRestaurante.videosModStatus === 1 ? t.videosEnRevision : t.videosGuardados;
        setTimeout(() => { document.getElementById("form-videos").style.display = "none"; }, 1200);
      } catch (err) {
        errorEl.textContent = t.errorConexion;
      } finally {
        botonEl.disabled = false;
      }
    }

      if (plato) mostrarFormPlato(plato);

    function mostrarPreviewFoto(url) {
      const img = document.getElementById("plato-foto-preview");
      if (url) {

        img.style.display = "block";

    document.getElementById("plato-foto").addEventListener("change", (e) => {
      const archivo = e.target.files[0];
      mostrarPreviewFoto(archivo ? URL.createObjectURL(archivo) : document.getElementById("plato-foto-actual").value);
    });

    async function subirFotoDelPlato(archivo) {
      const formData = new FormData();
      formData.append("file", archivo);

      const response = await fetch(`${API_URL}/api/restaurants/me/menu-photo`, {
        method: "POST",
        headers: { "Authorization": `Bearer ${token}` },
        body: formData
      });

      if (!response.ok) throw new Error("foto");

      const data = await response.json();
      miRestaurante.menuPhotos = miRestaurante.menuPhotos || [];
      miRestaurante.menuPhotos.push({ id: data.photoId, url: data.url });
      return data.url;
    }

    async function borrarFotoPorUrl(url) {
      if (!url) return;
      const foto = (miRestaurante.menuPhotos || []).find(f => f.url === url);
      if (!foto) return;

      try {
        await fetch(`${API_URL}/api/restaurants/me/menu-photo/${foto.id}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });
      } catch (err) {}

      miRestaurante.menuPhotos = miRestaurante.menuPhotos.filter(f => f.id !== foto.id);
    }

    function cancelarFormPlato() {
      document.getElementById("form-plato").style.display = "none";
    }

    async function guardarPlato() {
      const t = traducciones[idiomaActual];
      const errorEl = document.getElementById("error-plato");
      const exitoEl = document.getElementById("exito-plato");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      const id = document.getElementById("plato-id").value;
      const precioTexto = document.getElementById("plato-precio").value.trim();
      const precio = precioTexto === "" ? 0 : parseFloat(precioTexto);

      if (isNaN(precio) || precio < 0) {
        errorEl.textContent = t.precioInvalido;
        return;
      }

            const archivo = document.getElementById("plato-foto").files[0];
      const fotoAnterior = document.getElementById("plato-foto-actual").value;
      let fotoUrl = fotoAnterior || null;

      try {
        if (archivo) fotoUrl = await subirFotoDelPlato(archivo);
      } catch (err) {
        errorEl.textContent = t.noSePudoSubirFoto;
        return;
      }

      const body = {
        name: document.getElementById("plato-nombre").value,
        description: document.getElementById("plato-descripcion").value || null,
        price: precio,
               photoUrl: fotoUrl,
        isOffer: !!fotoUrl && document.getElementById("plato-oferta").checked
      };

      const esEdicion = !!id;
      const url = esEdicion
        ? `${API_URL}/api/restaurants/me/menu-items/${id}`
        : `${API_URL}/api/restaurants/me/menu-items`;

      try {
        const response = await fetch(url, {
          method: esEdicion ? "PUT" : "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
                    errorEl.textContent = t.noSePudoGuardarPlato;
          return;
        }

        if (archivo && fotoAnterior) await borrarFotoPorUrl(fotoAnterior);

        if (esEdicion) {
          await cargarMiPerfil();
          cancelarFormPlato();
          return;
        } else {
          const nuevo = await response.json();
          miRestaurante.menuItems = miRestaurante.menuItems || [];
          miRestaurante.menuItems.push(nuevo);
        }

        renderizarPlatos();
        cancelarFormPlato();
      } catch (err) {
        errorEl.textContent = t.errorConexion;
      }
    }

    async function eliminarPlato(id) {
      const t = traducciones[idiomaActual];
      const confirmar = confirm(t.confirmarEliminarPlato);
      if (!confirmar) return;

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/menu-items/${id}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
          alert(t.noSePudoEliminarPlato);
          return;
        }

        const platoBorrado = miRestaurante.menuItems.find(p => p.id === id);
        if (platoBorrado) await borrarFotoPorUrl(platoBorrado.photoUrl);
        miRestaurante.menuItems = miRestaurante.menuItems.filter(p => p.id !== id);
        renderizarPlatos();
      } catch (err) {
        alert(t.errorConexion);
      }
    }

    async function eliminarFoto(photoId) {
      const t = traducciones[idiomaActual];
      const confirmar = confirm(t.confirmarEliminarFoto);
      if (!confirmar) return;

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/menu-photo/${photoId}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
          alert(t.noSePudoEliminarFoto);
          return;
        }

        miRestaurante.menuPhotos = miRestaurante.menuPhotos.filter(f => f.id !== photoId);
        renderizarFotos();
      } catch (err) {
        alert(t.errorConexion);
      }
    }

    async function subirFoto() {
      const t = traducciones[idiomaActual];
      const errorEl = document.getElementById("error-foto");
      const exitoEl = document.getElementById("exito-foto");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      const inputFoto = document.getElementById("input-foto");
      const archivo = inputFoto.files[0];

      if (!archivo) {
        errorEl.textContent = t.elegirImagenPrimero;
        return;
      }

      const formData = new FormData();
      formData.append("file", archivo);

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/menu-photo`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });

        if (!response.ok) {
          errorEl.textContent = t.noSePudoSubirFoto;
          return;
        }

        const data = await response.json();
        miRestaurante.menuPhotos = miRestaurante.menuPhotos || [];
        miRestaurante.menuPhotos.push({ id: data.photoId, url: data.url });
        renderizarFotos();
        renderizarPlatos();
        inputFoto.value = "";
        exitoEl.textContent = t.fotoSubida;
      } catch (err) {
        errorEl.textContent = t.errorConexion;
      }
    }

    function previsualizarLogo(event) {
      const archivo = event.target.files[0];
      const preview = document.getElementById("logo-preview");
      if (archivo) {
        preview.src = URL.createObjectURL(archivo);
        preview.style.display = "inline-block";
      } else {
        preview.style.display = "none";
      }
    }

    async function subirLogo() {
      const t = traducciones[idiomaActual];
      const errorEl = document.getElementById("error-logo");
      const exitoEl = document.getElementById("exito-logo");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      const inputLogo = document.getElementById("input-logo");
      const archivo = inputLogo.files[0];

      if (!archivo) {
        errorEl.textContent = t.elegirImagenPrimero;
        return;
      }

      const formData = new FormData();
      formData.append("file", archivo);

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/logo`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });

        if (!response.ok) {
          errorEl.textContent = t.noSePudoSubirLogo;
          return;
        }

        const data = await response.json();
        miRestaurante.pendingLogoUrl = data.url;
        miRestaurante.logoModStatus = 1;
        renderizarLogo();
        inputLogo.value = "";
        exitoEl.textContent = t.logoEnRevision;
      } catch (err) {
        errorEl.textContent = t.errorConexion;
      }
    }

    function mostrarEstilo() {
      const div = document.getElementById("contenido-estilo");
      div.style.display = div.style.display === "none" ? "block" : "none";
    }

    function marcarEstilo() {
      if (!miRestaurante) return;
      const t = traducciones[idiomaActual];
      const e = miRestaurante.catalogStyle ?? 0;
      document.getElementById("estilo-0").textContent = (e === 0 ? "✓ " : "") + t.estiloTarjetas;
      document.getElementById("estilo-1").textContent = (e === 1 ? "✓ " : "") + t.estiloHorizontal;
    }

    async function elegirEstilo(n) {
      const t = traducciones[idiomaActual];
      const errorEl = document.getElementById("error-estilo");
      const exitoEl = document.getElementById("exito-estilo");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/catalog-style`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ style: n })
        });

        if (!response.ok) {
          errorEl.textContent = t.noSePudoGuardarEstilo;
          return;
        }

        miRestaurante.catalogStyle = n;
        marcarEstilo();
        exitoEl.textContent = t.estiloGuardado;
      } catch (err) {
        errorEl.textContent = t.errorConexion;
      }
    }
    function mostrarLogo() {
      const div = document.getElementById("contenido-logo");
      div.style.display = div.style.display === "none" ? "block" : "none";
    }

    async function cambiarEstado() {
      const t = traducciones[idiomaActual];
      const nuevoEstado = !miRestaurante.isOpen;

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/status`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ isOpen: nuevoEstado })
        });

        if (!response.ok) {
          alert(t.noSePudoCambiarEstado);
          return;
        }

        miRestaurante.isOpen = nuevoEstado;
        renderizarPerfil();
      } catch (err) {
        alert(t.errorConexion);
      }
    }

    function mostrarEdicionPerfil() {
      const r = miRestaurante;

      document.getElementById("editar-nombre").value = r.name ?? "";
      document.getElementById("editar-descripcion").value = r.description ?? "";
      document.getElementById("editar-direccion").value = r.address ?? "";
      document.getElementById("editar-telefono").value = r.phone ?? "";
      document.getElementById("editar-coords").value = `${r.latitude}, ${r.longitude}`;

      document.getElementById("editar-tiktok").value = r.tikTokLink ?? "";
      document.getElementById("editar-instagram").value = r.instagramLink ?? "";
      document.getElementById("editar-facebook").value = r.facebookLink ?? "";
      document.getElementById("editar-contacto-email").value = r.contactEmail ?? "";

      const selCat = document.getElementById("editar-categoria");
      selCat.value = r.category;
      if (!selCat.value) selCat.value = "Comida Rápida";

      document.getElementById("error-perfil").textContent = "";
      document.getElementById("exito-perfil").textContent = "";
      document.getElementById("form-editar").style.display = "block";
      window.scrollTo(0, document.body.scrollHeight);
    }

    function cancelarEdicionPerfil() {
      document.getElementById("form-editar").style.display = "none";
    }

    async function guardarPerfil() {
      const t = traducciones[idiomaActual];
      const errorEl = document.getElementById("error-perfil");
      const exitoEl = document.getElementById("exito-perfil");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      const telefonoIngresado = document.getElementById("editar-telefono").value;
      const formatoTelefonoValido = /^[0-9\s-]+$/.test(telefonoIngresado);
      if (!formatoTelefonoValido) {
        errorEl.textContent = t.telefonoInvalido;
        return;
      }

      const coordsTexto = document.getElementById("editar-coords").value;
      const formatoCoordsValido = /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(coordsTexto);
      if (!formatoCoordsValido) {
        errorEl.textContent = t.coordsInvalidas;
        return;
      }

            const partes = coordsTexto.split(",").map(p => parseFloat(p.trim()));

      const body = {
        name: document.getElementById("editar-nombre").value,
        description: document.getElementById("editar-descripcion").value || null,
        address: document.getElementById("editar-direccion").value,
        phone: telefonoIngresado,
        latitude: partes[0],
        longitude: partes[1],
        tikTokLink: document.getElementById("editar-tiktok").value || null,
        instagramLink: document.getElementById("editar-instagram").value || null,
        facebookLink: document.getElementById("editar-facebook").value || null,
        contactEmail: document.getElementById("editar-contacto-email").value || null,
                category: document.getElementById("editar-categoria").value
      };

      const botonEl = document.getElementById("boton-guardar-perfil");
      botonEl.disabled = true;
      botonEl.textContent = t.guardando;

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          errorEl.textContent = t.noSePudoGuardarPerfil;
          return;
        }

        miRestaurante = { ...miRestaurante, ...body };
        renderizarPerfil();
        exitoEl.textContent = t.perfilActualizado;
        setTimeout(() => { document.getElementById("form-editar").style.display = "none"; }, 1200);
      } catch (err) {
        errorEl.textContent = t.errorConexion;
      } finally {
        botonEl.disabled = false;
        botonEl.textContent = t.guardarCambios;
      }
    }

    function cerrarSesion() {
      sessionStorage.removeItem("token");
      window.location.href = "index.html";
    }

    function aplicarTema(tema) {
      document.documentElement.setAttribute("data-tema", tema);
      const t = traducciones[idiomaActual];
      document.getElementById("boton-tema").textContent = tema === "oscuro" ? t.temaClaro : t.temaOscuro;
      localStorage.setItem("tema", tema);
    }

    function cambiarTema() {
      const temaActual = document.documentElement.getAttribute("data-tema");
      aplicarTema(temaActual === "oscuro" ? "claro" : "oscuro");
    }

    function aplicarIdioma(idioma) {
      idiomaActual = idioma;
      localStorage.setItem("idioma", idioma);
      const t = traducciones[idioma];

      document.getElementById("boton-cerrar-sesion").textContent = t.cerrarSesion;
      document.getElementById("boton-idioma").textContent = t.botonIdioma;
      document.getElementById("boton-mostrar-logo").textContent = t.logoNegocio;
      document.getElementById("boton-subir-logo").textContent = t.subirLogo;
      document.getElementById("boton-estilo").textContent = t.estiloCatalogo;
      document.getElementById("texto-estilo").textContent = t.estiloTexto;
      document.getElementById("titulo-platos-menu").textContent = t.platosMenu;
      document.getElementById("boton-agregar-plato").textContent = t.agregarPlato;
      document.getElementById("boton-agregar-video").textContent = t.agregarVideo;
      document.getElementById("titulo-form-videos").textContent = t.tituloVideos;
      document.getElementById("video-1").placeholder = t.video1Placeholder;
      document.getElementById("video-2").placeholder = t.video2Placeholder;
      document.getElementById("etiqueta-oferta").textContent = t.etiquetaOferta;
      document.getElementById("video-oferta").placeholder = t.videoOfertaPlaceholder;
      document.getElementById("nota-videos-form").textContent = t.notaVideosOferta;
      document.getElementById("boton-guardar-videos").textContent = t.guardarVideos;
      document.getElementById("boton-cancelar-videos").textContent = t.cancelar;
      document.getElementById("nota-precio").textContent = t.notaPrecio;
      document.getElementById("boton-cancelar-plato").textContent = t.cancelar;
      document.getElementById("titulo-form-editar").textContent = t.editarPerfil;
      document.getElementById("boton-cancelar-perfil").textContent = t.cancelar;
      document.getElementById("boton-guardar-plato").textContent = t.guardarPlato;
      document.getElementById("etiqueta-elegir-foto").textContent = t.elegirFoto;
      document.getElementById("texto-oferta").textContent = t.marcarOferta;
      document.getElementById("boton-guardar-perfil").textContent = t.guardarCambios;
      document.getElementById("titulo-form-plato").textContent = modoFormPlato === "editar" ? t.editarPlato : t.nuevoPlato;

      document.getElementById("plato-nombre").placeholder = t.platoNombrePlaceholder;
      document.getElementById("plato-descripcion").placeholder = t.platoDescripcionPlaceholder;
      document.getElementById("plato-precio").placeholder = t.platoPrecioPlaceholder;
      document.getElementById("editar-nombre").placeholder = t.nombreRestaurantePlaceholder;
      document.getElementById("editar-descripcion").placeholder = t.descripcionPlaceholder;
      document.getElementById("editar-direccion").placeholder = t.direccionPlaceholder;
      document.getElementById("editar-telefono").placeholder = t.telefonoPlaceholder;
      document.getElementById("editar-coords").placeholder = t.coordsPlaceholder;
      document.getElementById("editar-tiktok").placeholder = t.tiktokPlaceholder;
      document.getElementById("editar-instagram").placeholder = t.instagramPlaceholder;
      document.getElementById("editar-facebook").placeholder = t.facebookPlaceholder;
      document.getElementById("editar-contacto-email").placeholder = t.contactoEmailPlaceholder;


      const selectCategoria = document.getElementById("editar-categoria");
      Array.from(selectCategoria.options).forEach(opcion => {
        opcion.textContent = idioma === "en" ? (categoriasEnIngles[opcion.value] || opcion.value) : opcion.value;
      });

      const temaActualAhora = document.documentElement.getAttribute("data-tema");
      document.getElementById("boton-tema").textContent = temaActualAhora === "oscuro" ? t.temaClaro : t.temaOscuro;

      if (miRestaurante) {
        renderizarPerfil();
      }
    }

    function cambiarIdioma() {
      aplicarIdioma(idiomaActual === "es" ? "en" : "es");
    }

    aplicarTema(localStorage.getItem("tema") || "claro");
    aplicarIdioma(idiomaActual);

    cargarMiPerfil();

    // Botón "atrás" del celular: volver al inicio (solo en la app)
    (function () {
      const AppPlugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
      const enApp = window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform();
      if (AppPlugin && enApp) {
        AppPlugin.addListener("backButton", () => {
          window.location.href = "index.html";
        });
      }
    })();
  </script>
