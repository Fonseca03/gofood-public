<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel del Restaurante</title>
  <style>
      :root {
      --fondo: #FAF6EF;
      --texto: #2A2420;
      --acento: #FF8000;
      --acento-claro: #FFA01A;
      --acento-oscuro: #E66800;
      --acento-texto: #FFFFFF;
      --abierto: #5C6B3F;
      --cerrado: #A13D3D;
      --borde: #E4DACB;
    }
    [data-tema="oscuro"] {
      --fondo: #121212;
      --texto: #EFEFEF;
      --acento: #FFA01A;
      --acento-claro: #FFB84D;
      --acento-oscuro: #FF8000;
      --acento-texto: #121212;
      --abierto: #93A76A;
      --cerrado: #C97070;
      --borde: #2E2E2E;
    }
  body {
    font-family: 'Inter', Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 0 20px;
    background: var(--fondo);
    color: var(--texto);
    transition: background 0.2s, color 0.2s;
  }
  input {
    display: block;
    margin-bottom: 10px;
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    background: var(--fondo);
    color: var(--texto);
    border: 1px solid var(--borde);
    border-radius: 4px;
  }
      button {
      padding: 14px 28px;
      font-size: 16px;
      cursor: pointer;
      background: linear-gradient(180deg, var(--acento-claro), var(--acento-oscuro));
      color: var(--acento-texto);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      box-shadow: 0 1.5px 3px rgba(0, 0, 0, 0.25);
      transform: scale(1);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    button:hover { opacity: 0.95; }
    button:active {
      transform: scale(0.97);
      box-shadow: inset 0 0 3px rgba(0, 0, 0, 0.35);
    }
  .estado-abierto { color: var(--abierto); font-weight: bold; }
  .estado-cerrado { color: var(--cerrado); font-weight: bold; }
  .campo { margin-bottom: 8px; }
  .campo strong { display: inline-block; width: 140px; }
  #error-carga, #error-perfil, #error-foto, #error-plato { color: var(--cerrado); }
  #exito-perfil, #exito-foto, #exito-plato { color: var(--abierto); }
  #form-editar, #form-plato {
    display: none;
    border-top: 1px solid var(--borde);
    margin-top: 20px;
    padding-top: 20px;
  }
  .foto-menu { max-width: 150px; margin: 5px; border-radius: 8px; }
  .plato-item {
    border: 1px solid var(--borde);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
  }
      .header-superior {
      position: relative;
      margin-bottom: 20px;
    }
    #boton-tema {
      background: transparent;
      color: var(--texto);
      border: 1px solid var(--borde);
      position: absolute;
      top: 0;
      right: 0;
    }
</style>
</head>
<body>

    <div class="header-superior">
    <button id="boton-tema" onclick="cambiarTema()">🌙 Modo oscuro</button>
    <img src="logo.png" alt="GoFood" style="display: block; margin: 0 auto; max-height: 180px;">
  </div>

  <h1 style="text-align: center;">Mi Restaurante</h1>
  <div style="text-align: center; margin-bottom: 20px;">
    <button onclick="cerrarSesion()">Cerrar sesión</button>
  </div>

  <div id="contenido">Cargando...</div>
  <p id="error-carga"></p>


  <div id="seccion-fotos">
  <h3>Fotos del menú</h3>
  <div id="galeria-fotos"></div>
  <input type="file" id="input-foto" accept="image/*">
  <button onclick="subirFoto()">Subir foto</button>
  <p id="error-foto"></p>
  <p id="exito-foto"></p>
  </div>

  <div id="seccion-platos">
  <h3>Platos del menú</h3>
  <div id="lista-platos"></div>
  <button onclick="mostrarFormPlato()">Agregar plato</button>
  </div>

  <div id="form-plato">
  <h3 id="titulo-form-plato">Nuevo plato</h3>
  <input type="hidden" id="plato-id" value="">
  <input type="text" id="plato-nombre" placeholder="Nombre del plato">
  <input type="text" id="plato-descripcion" placeholder="Descripción (opcional)">
  <input type="text" id="plato-precio" placeholder="Precio (ej: 8.50)">
  <button id="boton-guardar-plato" onclick="guardarPlato()">Guardar plato</button>
  <button type="button" onclick="cancelarFormPlato()">Cancelar</button>
  <p id="error-plato"></p>
  <p id="exito-plato"></p>
  </div>

<div id="form-editar">
    <h3>Editar perfil</h3>
    <input type="text" id="editar-nombre" placeholder="Nombre del restaurante">
    <input type="text" id="editar-descripcion" placeholder="Descripción (opcional)">
    <input type="text" id="editar-direccion" placeholder="Dirección">
        <input type="text" id="editar-telefono" placeholder="Teléfono con código de país (ej: 58 4141234567)" onkeypress="return /[0-9\s-]/.test(event.key)">
    <input type="text" id="editar-coords" placeholder="Coordenadas (7.759796, -72.214559)">
    <input type="text" id="editar-social" placeholder="Link de redes sociales (opcional)">
    <button id="boton-guardar-perfil" onclick="guardarPerfil()">Guardar cambios</button>
    <button type="button" onclick="cancelarEdicionPerfil()">Cancelar</button>
    <p id="error-perfil"></p>
    <p id="exito-perfil"></p>
  </div>

  <script>
    const API_URL = "https://gofood-api-production.up.railway.app";
    const token = sessionStorage.getItem("token");

    if (!token) {
      window.location.href = "index.html";
    }

    let miRestaurante = null;

    async function cargarMiPerfil() {
      try {
        const response = await fetch(`${API_URL}/api/restaurants/me`, {
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
          // Si el token quedó viejo o inválido, lo mandamos de nuevo al login
          sessionStorage.removeItem("token");
          window.location.href = "index.html";
          return;
        }

        miRestaurante = await response.json();
        renderizarPerfil();
      } catch (err) {
        document.getElementById("error-carga").textContent = "No se pudo conectar con la API.";
      }
    }

    function renderizarPerfil() {
      const r = miRestaurante;
      const claseEstado = r.isOpen ? "estado-abierto" : "estado-cerrado";
      const textoEstado = r.isOpen ? "Abierto" : "Cerrado";

      document.getElementById("contenido").innerHTML = `
        <h2>${r.name}</h2>
        <div class="campo"><strong>Descripción:</strong> ${r.description ?? "-"}</div>
        <div class="campo"><strong>Dirección:</strong> ${r.address ?? "-"}</div>
        <div class="campo"><strong>Teléfono:</strong> ${r.phone ?? "-"}</div>
        <div class="campo"><strong>Redes sociales:</strong> ${r.socialMediaLink ?? "-"}</div>
        <div class="campo"><strong>Estado:</strong> <span class="${claseEstado}">${textoEstado}</span></div>
        <button onclick="cambiarEstado()">Cambiar a ${r.isOpen ? "Cerrado" : "Abierto"}</button>
                <button onclick="mostrarEdicionPerfil()">Editar perfil</button>
      `;
      renderizarFotos();
      renderizarPlatos();
    }

        function renderizarFotos() {
      const galeria = document.getElementById("galeria-fotos");
      const fotos = miRestaurante.menuPhotos || [];

      if (fotos.length === 0) {
        galeria.innerHTML = "<p>No hay fotos cargadas todavía.</p>";
        return;
      }

      galeria.innerHTML = fotos.map(f => `
        <div style="display: inline-block; text-align: center;">
          <img class="foto-menu" src="${f.url}"><br>
          <button onclick="eliminarFoto('${f.id}')">Eliminar</button>
        </div>
      `).join("");
    }

    function renderizarPlatos() {
      const lista = document.getElementById("lista-platos");
      const platos = miRestaurante.menuItems || [];

      if (platos.length === 0) {
        lista.innerHTML = "<p>No hay platos cargados todavía.</p>";
        return;
      }

      lista.innerHTML = platos.map(p => `
        <div class="plato-item">
          <strong>${p.name}</strong> - $${p.price}<br>
          ${p.description ?? ""}<br>
          <button onclick='mostrarFormPlato(${JSON.stringify(p)})'>Editar</button>
          <button onclick="eliminarPlato('${p.id}')">Eliminar</button>
        </div>
      `).join("");
    }

    function mostrarFormPlato(plato) {
      document.getElementById("error-plato").textContent = "";
      document.getElementById("exito-plato").textContent = "";

      if (plato) {
        document.getElementById("titulo-form-plato").textContent = "Editar plato";
        document.getElementById("plato-id").value = plato.id;
        document.getElementById("plato-nombre").value = plato.name;
        document.getElementById("plato-descripcion").value = plato.description ?? "";
        document.getElementById("plato-precio").value = plato.price;
      } else {
        document.getElementById("titulo-form-plato").textContent = "Nuevo plato";
        document.getElementById("plato-id").value = "";
        document.getElementById("plato-nombre").value = "";
        document.getElementById("plato-descripcion").value = "";
        document.getElementById("plato-precio").value = "";
      }

      document.getElementById("form-plato").style.display = "block";
      window.scrollTo(0, document.body.scrollHeight);
    }

    function cancelarFormPlato() {
      document.getElementById("form-plato").style.display = "none";
    }

    async function guardarPlato() {
      const errorEl = document.getElementById("error-plato");
      const exitoEl = document.getElementById("exito-plato");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      const id = document.getElementById("plato-id").value;
      const precio = parseFloat(document.getElementById("plato-precio").value);

      if (isNaN(precio) || precio < 0) {
        errorEl.textContent = "Ingresá un precio válido (ej: 8.50).";
        return;
      }

      const body = {
        name: document.getElementById("plato-nombre").value,
        description: document.getElementById("plato-descripcion").value || null,
        price: precio,
        photoUrl: null
      };

      const esEdicion = !!id;
      const url = esEdicion
        ? `${API_URL}/api/restaurants/me/menu-items/${id}`
        : `${API_URL}/api/restaurants/me/menu-items`;

      try {
        const response = await fetch(url, {
          method: esEdicion ? "PUT" : "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          errorEl.textContent = "No se pudo guardar el plato.";
          return;
        }

        if (esEdicion) {
          const item = miRestaurante.menuItems.find(p => p.id === id);
          Object.assign(item, body);
        } else {
          const nuevo = await response.json();
          miRestaurante.menuItems = miRestaurante.menuItems || [];
          miRestaurante.menuItems.push(nuevo);
        }

        renderizarPlatos();
        cancelarFormPlato();
      } catch (err) {
        errorEl.textContent = "No se pudo conectar con la API.";
      }
    }

    async function eliminarPlato(id) {
      const confirmar = confirm("¿Seguro que querés eliminar este plato?");
      if (!confirmar) return;

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/menu-items/${id}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
          alert("No se pudo eliminar el plato.");
          return;
        }

        miRestaurante.menuItems = miRestaurante.menuItems.filter(p => p.id !== id);
        renderizarPlatos();
      } catch (err) {
        alert("No se pudo conectar con la API.");
      }
    }

    async function eliminarFoto(photoId) {
      const confirmar = confirm("¿Seguro que querés eliminar esta foto?");
      if (!confirmar) return;

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/menu-photo/${photoId}`, {
          method: "DELETE",
          headers: { "Authorization": `Bearer ${token}` }
        });

        if (!response.ok) {
          alert("No se pudo eliminar la foto.");
          return;
        }

        miRestaurante.menuPhotos = miRestaurante.menuPhotos.filter(f => f.id !== photoId);
        renderizarFotos();
      } catch (err) {
        alert("No se pudo conectar con la API.");
      }
    }



    async function subirFoto() {
      const errorEl = document.getElementById("error-foto");
      const exitoEl = document.getElementById("exito-foto");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      const inputFoto = document.getElementById("input-foto");
      const archivo = inputFoto.files[0];

      if (!archivo) {
        errorEl.textContent = "Elegí una imagen primero.";
        return;
      }

      const formData = new FormData();
      formData.append("file", archivo);

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/menu-photo`, {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` },
          body: formData
        });

        if (!response.ok) {
          errorEl.textContent = "No se pudo subir la foto.";
          return;
        }

        const data = await response.json();
        miRestaurante.menuPhotos = miRestaurante.menuPhotos || [];
        miRestaurante.menuPhotos.push({ id: data.photoId, url: data.url });
        renderizarFotos();
        renderizarPlatos();
        inputFoto.value = "";
        exitoEl.textContent = "Foto subida con éxito.";
      } catch (err) {
        errorEl.textContent = "No se pudo conectar con la API.";
      }
    
    }

    async function cambiarEstado() {
      const nuevoEstado = !miRestaurante.isOpen;

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me/status`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ isOpen: nuevoEstado })
        });

        if (!response.ok) {
          alert("No se pudo cambiar el estado.");
          return;
        }

        miRestaurante.isOpen = nuevoEstado;
        renderizarPerfil();
      } catch (err) {
        alert("No se pudo conectar con la API.");
      }
    }

    function mostrarEdicionPerfil() {
      const r = miRestaurante;

      document.getElementById("editar-nombre").value = r.name ?? "";
      document.getElementById("editar-descripcion").value = r.description ?? "";
      document.getElementById("editar-direccion").value = r.address ?? "";
      document.getElementById("editar-telefono").value = r.phone ?? "";
      document.getElementById("editar-coords").value = `${r.latitude}, ${r.longitude}`;
      document.getElementById("editar-social").value = r.socialMediaLink ?? "";

      document.getElementById("error-perfil").textContent = "";
      document.getElementById("exito-perfil").textContent = "";
      document.getElementById("form-editar").style.display = "block";
      window.scrollTo(0, document.body.scrollHeight);
    }

    function cancelarEdicionPerfil() {
      document.getElementById("form-editar").style.display = "none";
    }

    async function guardarPerfil() {
      const errorEl = document.getElementById("error-perfil");
      const exitoEl = document.getElementById("exito-perfil");
      errorEl.textContent = "";
      exitoEl.textContent = "";

      const telefonoIngresado = document.getElementById("editar-telefono").value;
      const formatoTelefonoValido = /^[0-9\s-]+$/.test(telefonoIngresado);
      if (!formatoTelefonoValido) {
        errorEl.textContent = "El teléfono solo puede contener números, espacios y guiones.";
        return;
      }

      const coordsTexto = document.getElementById("editar-coords").value;
      const formatoCoordsValido = /^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(coordsTexto);
      if (!formatoCoordsValido) {
        errorEl.textContent = "Las coordenadas deben tener el formato: número, coma, número (ej: 7.75, -72.21).";
        return;
      }

      const partes = coordsTexto.split(",").map(p => parseFloat(p.trim()));

      const body = {
        name: document.getElementById("editar-nombre").value,
        description: document.getElementById("editar-descripcion").value || null,
        address: document.getElementById("editar-direccion").value,
        phone: telefonoIngresado,
        latitude: partes[0],
        longitude: partes[1],
        socialMediaLink: document.getElementById("editar-social").value || null
      };

      const botonEl = document.getElementById("boton-guardar-perfil");
      botonEl.disabled = true;
      botonEl.textContent = "Guardando...";

      try {
        const response = await fetch(`${API_URL}/api/restaurants/me`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) {
          errorEl.textContent = "No se pudo guardar el perfil. Revisá los datos.";
          return;
        }

        // Actualizamos los datos en memoria con lo que acabamos de guardar
        miRestaurante = { ...miRestaurante, ...body };
        renderizarPerfil();
        exitoEl.textContent = "Perfil actualizado con éxito.";
        setTimeout(() => { document.getElementById("form-editar").style.display = "none"; }, 1200);
      } catch (err) {
        errorEl.textContent = "No se pudo conectar con la API.";
      } finally {
        botonEl.disabled = false;
        botonEl.textContent = "Guardar cambios";
      }
    }

    function cerrarSesion() {
      sessionStorage.removeItem("token");
      window.location.href = "index.html";
    }

    function aplicarTema(tema) {
      document.documentElement.setAttribute("data-tema", tema);
      document.getElementById("boton-tema").textContent = tema === "oscuro" ? "☀️ Modo claro" : "🌙 Modo oscuro";
      localStorage.setItem("tema", tema);
    }

    function cambiarTema() {
      const temaActual = document.documentElement.getAttribute("data-tema");
      aplicarTema(temaActual === "oscuro" ? "claro" : "oscuro");
    }

    aplicarTema(localStorage.getItem("tema") || "claro");

    cargarMiPerfil();
  </script>

</body>
</html>
